experiments:
  smoke_gss:
    # Tiny end-to-end sanity check: one condition, one dataset.
    datasets: [gss]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 100

  pilot_gss:
    datasets: [gss]
    conditions: [full_agent, agent_no_semantic, agent_no_data, direct_generation]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_gss_unseen:
    datasets: [gss]
    conditions: [full_agent_unseen]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
    unseen_variables:
      gss: [age_first_childbirth]

  pilot_cps:
    datasets: [cps]
    conditions: [full_agent, agent_no_semantic, agent_no_data, direct_generation]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_cps_unseen:
    datasets: [cps]
    conditions: [full_agent_unseen]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
    unseen_variables:
      cps: [income]

  pilot_acs:
    datasets: [acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data, direct_generation]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_acs_unseen:
    datasets: [acs]
    conditions: [full_agent_unseen]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
    unseen_variables:
      acs: [income]

  # Paper-faithful replication: 3 agent conditions (skip direct_generation
  # which is per-row and ~2h/dataset). Run after wiring real_data/used_dataset/
  # sampled_*.csv on 2026-05-02. Direct_generation can run as a separate
  # follow-up experiment.
  pilot_paper_agents:
    datasets: [gss, cps, acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_paper_direct:
    datasets: [gss, cps, acs]
    conditions: [direct_generation]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  # A/B comparison vs pilot_paper_agents to measure the impact of the
  # preserve-missingness instruction added to modeling_prompt on 2026-05-02.
  # Hypothesis: ACS type-3 should jump from NaN to ~0.5+ for full_agent
  # because the conditionally-missing predictors will retain their NaN
  # rather than being imputed (which destroys the regression).
  pilot_paper_agents_preserve:
    datasets: [gss, cps, acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  # Longitudinal panels: extends T4 (event-order chi-sq) and T5 (event-order ×
  # covariate eta²/Cramér's V) coverage. Schema loader filters out per-age
  # sequential cols (income_14..65 etc.) so the agent only models the
  # static aggregates that T1-T5 actually evaluate.
  smoke_nlsy:
    datasets: [nlsy]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 200

  pilot_paper_longitudinal:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [full_agent]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
