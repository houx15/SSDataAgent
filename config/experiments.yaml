experiments:
  # =========================================================================
  # SHIP demonstration (2026-07-06): exercise every refactor strategy on real
  # data and surface it in the web console. Baselines are zero-API-cost and
  # deterministic; Design A/B/C + S1 use LLM elicitation (gpt-5.4, cached).
  # Agent-family conditions already have results under pilot_paper_*/exp*.
  # Tier 0 — statistical baselines (FULL only; microdata; free & fast).
  # =========================================================================
  ship_baselines_cross:
    datasets: [gss, cps, acs]
    conditions: [hotdeck, cart, copula]
    max_iterations: 1
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  ship_baselines_long:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [hotdeck, cart, copula]
    max_iterations: 1
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  # Tier 1 — Design A + Design C on all 8 datasets. Both are ~1 LLM call per
  # (dataset, condition): Design A elicits a DAG once; Design C elicits one
  # population-level transport prior (condition B only). Cheap everywhere.
  ship_designs_ac_cross:
    datasets: [gss, cps, acs]
    conditions: [design_a_full, design_a_aggregate, design_c_full, design_c_aggregate]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  ship_designs_ac_long:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [design_a_full, design_a_aggregate, design_c_full, design_c_aggregate]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  # T4 event-order fix: joint event-timing repair + full-source data scale.
  # Longitudinal life-event ages (work/sex/marriage) are drawn independently by
  # every strategy -> T4 (event ordering) scores a rock-solid 0.000. This
  # experiment (a) draws 6000 rows from the full source so the sparse
  # all-three-events subset is large enough to stabilize the over-powered T4/T5
  # bootstrap, and (b) replaces the event-age block with a covariate-matched
  # joint donor resample. Offline validation (6 seeds): T4 0.000 -> ~0.43 mean,
  # T5 preserved (~0.8). T4 is HIGH-VARIANCE per run -> launch several seeds and
  # read the mean. Copy this block with seed: 43, 44, ... for multi-seed.
  ship_t4_addhealth:
    datasets: [addhealth]
    conditions: [full_agent, design_c_full]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 3000
    seed: 42
    full_source_sample: 6000
    event_timing_repair: true
    event_timing_condition_cols:
      addhealth: [gender, race]
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  # Tier 2 — per-cell strategies (Design B + S1) ONLY on the small-cell datasets
  # cps (35 cells) and acs (54 cells). One gpt-5.4 call per cell, so these are
  # deliberately kept off gss/longitudinal (hundreds of cells each).
  ship_percell_small:
    datasets: [cps, acs]
    conditions: [design_b_full, design_b_aggregate,
                 s1_raw, s1_raked_full, s1_raked_aggregate, s1_personas]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  # Tier 3 — TRANSFER (source wave -> target wave). Cheap A/C transfer on both
  # gss+cps; per-cell B / S1 transfer only on cps (small cell count).
  ship_transfer_cheap:
    datasets: [gss, cps]
    conditions: [design_a_transfer, design_c_transfer]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  ship_transfer_percell:
    datasets: [cps]
    conditions: [design_b_transfer, s1_raked_transfer]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  smoke_gss:
    # Tiny end-to-end sanity check: one condition, one dataset.
    datasets: [gss]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 100

  # Tiny end-to-end check that the rubric variant + done.flag wiring works
  # end-to-end through a real LLM call. ~1-2 min. Should be run before any
  # full EXP-001 batch on a cloud box.
  smoke_gss_rubric:
    datasets: [gss]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 100
    prompt_variant: rubric
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  pilot_gss:
    datasets: [gss]
    conditions: [full_agent, agent_no_semantic, agent_no_data, direct_generation]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_gss_unseen:
    datasets: [gss]
    conditions: [full_agent_unseen]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
    unseen_variables:
      gss: [age_first_childbirth]

  pilot_cps:
    datasets: [cps]
    conditions: [full_agent, agent_no_semantic, agent_no_data, direct_generation]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_cps_unseen:
    datasets: [cps]
    conditions: [full_agent_unseen]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
    unseen_variables:
      cps: [income]

  pilot_acs:
    datasets: [acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data, direct_generation]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_acs_unseen:
    datasets: [acs]
    conditions: [full_agent_unseen]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
    unseen_variables:
      acs: [income]

  # Paper-faithful replication: 3 agent conditions (skip direct_generation
  # which is per-row and ~2h/dataset). Run after wiring real_data/used_dataset/
  # sampled_*.csv on 2026-05-02. Direct_generation can run as a separate
  # follow-up experiment.
  pilot_paper_agents:
    datasets: [gss, cps, acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_paper_direct:
    datasets: [gss, cps, acs]
    conditions: [direct_generation]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  # A/B comparison vs pilot_paper_agents to measure the impact of the
  # preserve-missingness instruction added to modeling_prompt on 2026-05-02.
  # Hypothesis: ACS type-3 should jump from NaN to ~0.5+ for full_agent
  # because the conditionally-missing predictors will retain their NaN
  # rather than being imputed (which destroys the regression).
  pilot_paper_agents_preserve:
    datasets: [gss, cps, acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  # Longitudinal panels: extends T4 (event-order chi-sq) and T5 (event-order ×
  # covariate eta²/Cramér's V) coverage. Schema loader filters out per-age
  # sequential cols (income_14..65 etc.) so the agent only models the
  # static aggregates that T1-T5 actually evaluate.
  smoke_nlsy:
    datasets: [nlsy]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 200

  pilot_paper_longitudinal:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [full_agent]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_paper_longitudinal_retry:
    datasets: [cfps, us]
    conditions: [full_agent]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  # =========================================================================
  # Model-labeled re-runs. Same datasets/conditions as the corresponding
  # un-suffixed experiments above — only the LLM differs (set via .env /
  # config/llm.yaml). Results land under results/<this name>/... so the
  # baseline DeepSeek runs stay untouched and the model is visible in the
  # path, not just buried in meta.json.
  # =========================================================================
  smoke_gpt54mini:
    datasets: [gss]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 100

  pilot_paper_agents_gpt54mini:
    datasets: [gss, cps, acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_paper_longitudinal_gpt54mini:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [full_agent]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_paper_longitudinal_gpt54mini_retry:
    datasets: [us]
    conditions: [full_agent]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  # gpt-5.4 (full, not -mini). Same datasets/conditions as the un-suffixed
  # paper experiments; only the LLM differs. Active model is set in .env /
  # config/llm.yaml — keep them in sync with the experiment name being run.
  pilot_paper_agents_gpt54:
    datasets: [gss, cps, acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_paper_longitudinal_gpt54:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [full_agent]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  pilot_paper_longitudinal_gpt54_retry:
    datasets: [us]
    conditions: [full_agent]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000

  # =========================================================================
  # EXP-001 (matrix-of-variants framework). Each entry below differs only in
  # `prompt_variant` from the corresponding gpt-5.4 baseline above. Run via
  # `python scripts/run_batch.py exp001_rubric_cross exp001_rubric_long`.
  # The agent's API key still comes from .env (never config).
  # =========================================================================
  exp001_rubric_cross:
    datasets: [gss, cps, acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  exp001_rubric_long:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [full_agent]
    max_iterations: 3
    sandbox_timeout: 60
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  # =========================================================================
  # EXP-006 spike — tool-using agent, ACS only, single condition.
  # Smoke and full variants. Compares to pilot_paper_agents_gpt54[acs] (0.505)
  # and exp001_rubric_cross[acs] (full_agent: 0.369).
  # =========================================================================
  smoke_acs_tools:
    datasets: [acs]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 100
    prompt_variant: rubric_tools
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  exp006a_tools_acs:
    datasets: [acs]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1


  exp006b_tools_cross:
    datasets: [gss, cps, acs]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  exp006b_tools_long:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1


  # =========================================================================
  # EXP-006c — same datasets/conditions as exp006b but with rubric_tools_v2
  # (family-selection recipe + longitudinal chronology recipe). Goal:
  # close the T3 gap on cross-sectional and lift T4 on longitudinal.
  # =========================================================================
  smoke_acs_tools_v2:
    datasets: [acs]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 100
    prompt_variant: rubric_tools_v2
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  exp006c_tools_cross:
    datasets: [gss, cps, acs]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools_v2
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  exp006c_tools_long:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools_v2
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  # =========================================================================
  # EXP-006e (rubric_tools_v3) — fixes the longitudinal regression seen in
  # EXP-006c. Two changes vs v2:
  #   • Hard gate: commit_generator now refuses chains with ≥2 event-age
  #     columns until score_event_order has been called. Recipe surfaces
  #     this gate explicitly so the agent doesn't loop.
  #   • Family recipe corrected: many-valued event-age targets use
  #     empirical_lookup conditioned on prior events — NOT linear_regression
  #     (which collapsed nlsy T3 from 0.494 to 0.298 in EXP-006c).
  # Smoke first locally on nlsy to confirm score_event_order fires before
  # spending cloud time on the full long batch.
  # =========================================================================
  smoke_nlsy_tools_v3:
    datasets: [nlsy]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 100
    prompt_variant: rubric_tools_v3
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  exp006e_tools_long:
    datasets: [nlsy, addhealth, cfps, us]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools_v3
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  # Cross-sectional retest with v3 — should preserve the gss/cps T3 lift v2
  # produced (0.207→0.485 / 0.197→0.537) while v3's family-recipe correction
  # leaves cross-sectional rules unchanged. Light insurance run.
  exp006e_tools_cross:
    datasets: [gss, cps, acs]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools_v3
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  # =========================================================================
  # EXP-006f diagnostic — cfps + addhealth alone with the persist-on-error
  # and soft-fail chronology gate fixes from commit b604880 in place.
  # EXP-006e on the cloud crashed on both datasets after hitting max_turns
  # against the chronology gate, and the pre-fix orchestrator lost the
  # transcripts. Same prompt (rubric_tools_v3) and model as 006e so the
  # comparison is clean — only the orchestrator + commit-gate plumbing
  # changed. nlsy/us are excluded; they completed cleanly on 006e.
  # =========================================================================
  exp006f_tools_diag:
    datasets: [cfps, addhealth]
    conditions: [full_agent]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools_v3
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

  # =========================================================================
  # EXP-006d — ablation on tools path. Tests whether the no_semantic
  # advantage seen in EXP-001 (agent_no_semantic outscored full_agent on
  # ACS by +0.27) persists on the tool-using path. Cross only — longitudinal
  # ablations would 2x the cost without changing the question.
  # =========================================================================
  exp006d_tools_ablation_cross:
    datasets: [gss, cps, acs]
    conditions: [full_agent, agent_no_semantic, agent_no_data]
    max_iterations: 1
    sandbox_timeout: 90
    train_eval_split: 0.5
    n_rows: 1000
    prompt_variant: rubric_tools_v2
    llm_model: gpt-5.4-2026-03-05
    llm_provider: openai
    llm_base_url: https://api.openai.com/v1

