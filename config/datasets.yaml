datasets:
  gss:
    real_data_path: real_data/used_dataset/sampled_gss.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/gss2018.yaml
    ssdatabench_sim_subdir: gss_2018
    evaluation_script: scripts/evaluation/gss_2018.py
    type: cross-sectional
  cps:
    real_data_path: real_data/used_dataset/samples_cps.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/cps1980.yaml
    ssdatabench_sim_subdir: cps_1980
    evaluation_script: scripts/evaluation/cps_1980.py
    type: cross-sectional
  acs:
    real_data_path: real_data/used_dataset/sampled_acs.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/acs1980.yaml
    ssdatabench_sim_subdir: acs_1980
    evaluation_script: scripts/evaluation/acs_1980.py
    type: cross-sectional
  # Transfer sources (Part 3a) — earlier waves, loaded as condition-B source
  # microdata only; never scored. Reuse the target wave's ssdatabench_yaml since
  # GSS/CPS variable names are stable across waves (verified: gss1994 shares ~25
  # vars with gss2018; cps-asec1970 shares all 12 with cps1980).
  gss1994:
    real_data_path: real_data/gss/gss1994.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/gss2018.yaml
    ssdatabench_sim_subdir: gss_2018
    evaluation_script: scripts/evaluation/gss_2018.py
    type: cross-sectional
  cps1970:
    real_data_path: real_data/cps/cps-asec1970.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/cps1980.yaml
    ssdatabench_sim_subdir: cps_1980
    evaluation_script: scripts/evaluation/cps_1980.py
    type: cross-sectional
  # Longitudinal panels (added 2026-05-03 to extend coverage to T4/T5).
  # Sequential per-age columns (income_14..65 etc.) are filtered by the schema
  # loader because SSDataBench's T1-T5 only references static aggregates.
  nlsy:
    real_data_path: real_data/used_dataset/sampled_nlsy.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/nlsy79.yaml
    ssdatabench_sim_subdir: nlsy
    evaluation_script: scripts/evaluation/nlsy.py
    type: longitudinal
  addhealth:
    real_data_path: real_data/used_dataset/sampled_addhealth.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/AddHealth.yaml
    ssdatabench_sim_subdir: addhealth
    evaluation_script: scripts/evaluation/addhealth.py
    type: longitudinal
  cfps:
    real_data_path: real_data/used_dataset/sampled_cfps.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/cfps.yaml
    ssdatabench_sim_subdir: cfps
    evaluation_script: scripts/evaluation/cfps.py
    type: longitudinal
  us:
    real_data_path: real_data/used_dataset/sampled_US.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/UnderstandingSociety.yaml
    ssdatabench_sim_subdir: US
    evaluation_script: scripts/evaluation/us.py
    type: longitudinal

  # Legacy paths from the pre-2026-05-02 cross-dataset pilots (11/12/13 var subsets).
  # Kept for reproducibility of the docs/report/2026-04-30-initial-findings.md numbers.
  gss_legacy:
    real_data_path: real_data/gss_clean.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/gss2018.yaml
    ssdatabench_sim_subdir: gss_2018
    evaluation_script: scripts/evaluation/gss_2018.py
    type: cross-sectional
  cps_legacy:
    real_data_path: real_data/cps_clean.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/cps1980.yaml
    ssdatabench_sim_subdir: cps_1980
    evaluation_script: scripts/evaluation/cps_1980.py
    type: cross-sectional
  acs_legacy:
    real_data_path: real_data/acs_clean.csv
    ssdatabench_yaml: ssdatabench/real_data/data_configs/acs1980.yaml
    ssdatabench_sim_subdir: acs_1980
    evaluation_script: scripts/evaluation/acs_1980.py
    type: cross-sectional
